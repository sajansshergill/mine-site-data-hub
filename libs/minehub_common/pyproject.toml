[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minehub-common"
version = "0.1.0"
description = "Shared settings, contracts, Kafka helpers and DB utilities for Mine Site Data Hub"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "confluent-kafka>=2.3",
  "fastavro>=1.9",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "python-dateutil>=2.9",
  "tenacity>=8.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["minehub_common*"]
