global:
  resolve_timeout: 5m
  smtp_smarthost: mailhog:1025
  smtp_from: alerts@minehub.demo.local
  smtp_require_tls: false

route:
  receiver: email-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: email-critical
      continue: true

receivers:
  - name: email-default
    email_configs:
      - to: shift-superintendent@demo.local
        send_resolved: true

  - name: email-critical
    email_configs:
      - to: oncall@demo.local
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity = critical]
    target_matchers: [severity = warning]
    equal: [alertname]
