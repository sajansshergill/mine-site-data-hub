groups:
  - name: data
    rules:
      - alert: DLQGrowing
        expr: |
          (
            sum(rate(minehub_dlq_total[15m])) by (service)
            /
            clamp_min(sum(rate(minehub_messages_in_total[15m])) by (service), 0.001)
          ) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DLQ growing for {{ $labels.service }}"
          description: "Dead-letter rate exceeds 1% of input for {{ $labels.service }}."
          runbook: "docs/runbook.md#dlqgrowing"

      - alert: TagStale
        expr: (time() - minehub_last_message_unixtime{source=~"opcua|plant"}) > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical plant tag stale ({{ $labels.source }})"
          description: "No plant/OPC UA update for over 10 minutes."
          runbook: "docs/runbook.md#tagstale"

      - alert: DQFailure
        expr: minehub_dq_failures > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Data-quality check failed"
          description: "{{ $value }} critical DQ check(s) failing — see ops.dq_results."
          runbook: "docs/runbook.md#dqfailure"
