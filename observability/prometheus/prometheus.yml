global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    site: demo-gold-mine
    env: on-prem

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/platform.rules.yml
  - /etc/prometheus/rules/data.rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { service: api }

  - job_name: connectors
    static_configs:
      - targets:
          - mqtt-connector:9100
          - opcua-connector:9100
          - modbus-connector:9100
          - stream-processor:9100
          - sink:9100
        labels: { component: edge }

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { service: timescaledb }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
