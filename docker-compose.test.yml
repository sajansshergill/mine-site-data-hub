# Slim stack for integration tests.
# Usage: docker compose -f docker-compose.test.yml up -d

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: minehub
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: minehub
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minehub"]
      interval: 5s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --schema-registry-addr
      - 0.0.0.0:8081
    ports: ["9092:9092", "8081:8081"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: [./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://minehub:change-me@timescaledb:5432/minehub
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /app/config
    ports: ["8000:8000"]
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
