[PARSER]
    Name        vendor_a
    Format      regex
    Regex       ^(?<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?<equipment_id>[A-Z0-9]+) STATUS=(?<raw_code>\d+)$
    Time_Key    ts
    Time_Format %Y-%m-%d %H:%M:%S
    Time_Keep   On

[PARSER]
    Name        vendor_b
    Format      regex
    Regex       ^\[(?<ts>\d{2}/\d{2}/\d{4} \d{1,2}:\d{2}:\d{2} [AP]M [A-Z]+)\] (?<equipment_id>[A-Z0-9]+) (?<raw_code>[A-Z]+)$
    Time_Key    ts
    Time_Format %m/%d/%Y %I:%M:%S %p %Z
    Time_Keep   On

[PARSER]
    Name        vendor_c
    Format      regex
    Regex       ^(?<ts>\d{2}-[A-Za-z]{3}-\d{4}T\d{2}:\d{2}:\d{2}[+-]\d{4})\|(?<equipment_id>[A-Z0-9]+)\|(?<raw_code>[A-Z]+)\|.*$
    Time_Key    ts
    Time_Format %d-%b-%YT%H:%M:%S%z
    Time_Keep   On
