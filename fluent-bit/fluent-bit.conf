[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    storage.path /fluent-bit/storage

[INPUT]
    Name              tail
    Tag               equipment.vendor_a
    Path              /var/log/equipment/vendor_a_status.log
    Parser            vendor_a
    DB                /fluent-bit/storage/vendor_a.db
    Read_from_Head    On
    Refresh_Interval  2

[INPUT]
    Name              tail
    Tag               equipment.vendor_b
    Path              /var/log/equipment/vendor_b_status.log
    Parser            vendor_b
    DB                /fluent-bit/storage/vendor_b.db
    Read_from_Head    On
    Refresh_Interval  2

[INPUT]
    Name              tail
    Tag               equipment.vendor_c
    Path              /var/log/equipment/vendor_c_status.log
    Parser            vendor_c
    DB                /fluent-bit/storage/vendor_c.db
    Read_from_Head    On
    Refresh_Interval  2

[FILTER]
    Name    lua
    Match   equipment.*
    script  /fluent-bit/etc/lua/normalize_equipment_log.lua
    call    normalize

[FILTER]
    Name    lua
    Match   equipment.*
    script  /fluent-bit/etc/lua/drop_and_count.lua
    call    drop_or_route

[FILTER]
    Name          rewrite_tag
    Match         equipment.*
    Rule          $dlq ^(true)$ equipment.dlq false
    Emitter_Name  re_emitted

[OUTPUT]
    Name           kafka
    Match          equipment.vendor_*
    Brokers        ${KAFKA_BOOTSTRAP}
    Topics         equipment.events
    Timestamp_Key  ts
    Timestamp_Format iso8601
    rdkafka.log.connection.close false
    rdkafka.queue.buffering.max.ms 100

[OUTPUT]
    Name           kafka
    Match          equipment.dlq
    Brokers        ${KAFKA_BOOTSTRAP}
    Topics         equipment.events.dlq
    Timestamp_Key  ts
    Timestamp_Format iso8601
    rdkafka.log.connection.close false
