apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescaledb
    access: proxy
    url: timescaledb:5432
    user: minehub
    secureJsonData:
      password: change-me
    jsonData:
      database: minehub
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
