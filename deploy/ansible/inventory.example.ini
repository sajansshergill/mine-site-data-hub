# Copy to inventory.ini and edit for the site server.
[minehub]
site-server ansible_host=10.0.0.50 ansible_user=minehub

[minehub:vars]
ansible_python_interpreter=/usr/bin/python3
minehub_root=/opt/minehub
minehub_compose_file=docker-compose.yml
backup_dir=/var/backups/minehub
backup_retain_days=14
site_tz=America/Los_Angeles
