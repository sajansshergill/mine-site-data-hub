---
- name: Create application root
  file:
    path: "{{ minehub_root }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Sync repository to host
  synchronize:
    src: "{{ playbook_dir }}/../../"
    dest: "{{ minehub_root }}/"
    delete: false
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.venv"
      - "--exclude=**/__pycache__"

- name: Ensure .env exists
  copy:
    src: "{{ minehub_root }}/.env.example"
    dest: "{{ minehub_root }}/.env"
    remote_src: true
    force: false
    mode: "0600"

- name: Pull / build and start stack
  community.docker.docker_compose_v2:
    project_src: "{{ minehub_root }}"
    state: present
    build: always
  register: compose_result

- name: Install systemd unit for stack restart on boot
  copy:
    dest: /etc/systemd/system/minehub.service
    mode: "0644"
    content: |
      [Unit]
      Description=Mine Site Data Hub
      Requires=docker.service
      After=docker.service network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory={{ minehub_root }}
      ExecStart=/usr/bin/docker compose up -d
      ExecStop=/usr/bin/docker compose down
      TimeoutStartSec=0

      [Install]
      WantedBy=multi-user.target

- name: Enable minehub systemd unit
  systemd:
    name: minehub
    enabled: true
    daemon_reload: true
